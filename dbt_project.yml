name: 'thc_analytics'
version: '1.0.0'
config-version: 2

profile: 'thc_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  thc_analytics:
    staging:
      # Materialization of staging models
      +materialized: view
    marts:
      # Materialization of marts models
      +materialized: table
flags:
  require_generic_test_arguments_property: true